name: Release runtime

on:
  workflow_dispatch:
    inputs:
      release_ref:
        description: Reviewed immutable runtime tag (for example v0.2.0)
        required: true
        type: string
      push_latest:
        description: Also publish latest for a stable release
        required: true
        default: true
        type: boolean

permissions:
  contents: write
  id-token: write
  attestations: write
  artifact-metadata: write

concurrency:
  group: solar-edge-release-${{ github.event.repository.full_name }}
  cancel-in-progress: false

env:
  RELEASE_IMAGE: piphinetwork/piphi-network-solar-edge
  DOCKERHUB_ORGANIZATION: ${{ vars.DOCKERHUB_ORGANIZATION || 'piphinetwork' }}
  DOCKERHUB_OIDC_CONNECTIONID: ${{ vars.DOCKERHUB_OIDC_CONNECTIONID }}

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Require trusted default-branch dispatch and tag-shaped ref
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${GITHUB_REF_NAME}" != "${{ github.event.repository.default_branch }}" ]]; then
            echo "Dispatch releases from ${{ github.event.repository.default_branch }}." >&2
            exit 1
          fi
          if [[ ! "${{ inputs.release_ref }}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([+-][0-9A-Za-z.-]+)?$ ]]; then
            echo "release_ref must be an immutable semantic-version tag such as v0.2.0." >&2
            exit 1
          fi
      - name: Check out immutable release tag
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ inputs.release_ref }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install locked project
        run: |
          python -m pip install --upgrade pip pdm
          pdm install -G dev --check
      - name: Validate tag and synchronized metadata
        id: version
        shell: bash
        run: |
          set -euo pipefail
          VERSION=$(python -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')
          if [[ "${{ inputs.release_ref }}" != "v${VERSION}" ]]; then
            echo "Tag ${{ inputs.release_ref }} does not match project version ${VERSION}." >&2
            exit 1
          fi
          if [[ "${VERSION}" == *-* ]]; then STABLE=false; else STABLE=true; fi
          if [[ "${{ inputs.push_latest }}" == "true" && "${STABLE}" != "true" ]]; then
            echo "latest can only be published for a stable release." >&2
            exit 1
          fi
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "stable=${STABLE}" >> "$GITHUB_OUTPUT"
          echo "revision=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - name: Run release-candidate checks
        run: |
          pdm run pytest
          pdm run python scripts/validate.py
          pdm run python scripts/build_experience.py --check
          pdm build
      - name: Require Docker Hub OIDC configuration
        shell: bash
        run: |
          set -euo pipefail
          test -n "${DOCKERHUB_ORGANIZATION}" || { echo "Set DOCKERHUB_ORGANIZATION." >&2; exit 1; }
          test -n "${DOCKERHUB_OIDC_CONNECTIONID}" || { echo "Set DOCKERHUB_OIDC_CONNECTIONID." >&2; exit 1; }
      - name: Log in to Docker Hub with OIDC
        uses: docker/login-action@v4
        env:
          DOCKERHUB_OIDC_CONNECTIONID: ${{ vars.DOCKERHUB_OIDC_CONNECTIONID }}
        with:
          username: ${{ env.DOCKERHUB_ORGANIZATION }}
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - name: Prepare image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.RELEASE_IMAGE }}
          tags: |
            type=raw,value=${{ steps.version.outputs.version }}
            type=raw,value=latest,enable=${{ inputs.push_latest && steps.version.outputs.stable == 'true' }}
          labels: |
            org.opencontainers.image.title=SolarEdge
            org.opencontainers.image.description=Read-only SolarEdge power-flow and production integration for PiPhi Network.
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ steps.version.outputs.revision }}
            org.opencontainers.image.version=${{ steps.version.outputs.version }}
      - name: Build and push image
        id: push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=min
          provenance: mode=max
          sbom: true
      - name: Attest image provenance
        uses: actions/attest-build-provenance@v3
        with:
          subject-name: docker.io/${{ env.RELEASE_IMAGE }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true
      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.release_ref }}
          generate_release_notes: true
          prerelease: ${{ steps.version.outputs.stable != 'true' }}
          name: ${{ inputs.release_ref }}
